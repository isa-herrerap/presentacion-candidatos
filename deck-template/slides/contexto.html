<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Contexto — Presentación de candidatos</title>
<!-- Lámina CONTEXTO — plantilla fija: todo lo que varía por proceso viene de
     data/proceso.js (PROCESO.contexto). El título de arriba es el fallback
     antes de que corra el JS; el definitivo lo pone document.title.

     v16 — esta lámina muestra UN SOLO gráfico: la dimensión que el proceso
     declara en `contexto.principal` (hoy "origen"), grande y centrada. Sobre
     cada columna va el PORCENTAJE, no el conteo: acá lo que se cuenta es de
     dónde salieron los candidatos, y "87% / 13%" se entiende de una pasada
     mientras que "214 / 31" obliga a dividir mentalmente. El eje Y sí sigue en
     conteos, para que la cifra exacta esté disponible si el cliente pregunta.

     Y si la pregunta es directa ("¿cuántos son ese 13%?"), pasar el mouse por
     encima de la columna cambia el rótulo al conteo real, y sale solo al
     retirarlo. Mismo gesto en contexto-detalle.html, al revés: allá manda el
     conteo y el hover revela el porcentaje.

     POR QUÉ SE PARTIÓ EN DOS LÁMINAS: hasta la v15 las cuatro dimensiones
     (origen, experiencia, cargo, última empresa) convivían en una cuadrícula
     2×2 con filtro cruzado. El problema no era visual sino de datos: la ficha
     completa — experiencia, cargo, última empresa — sólo se tiene de los
     candidatos contactados por HUNTING; de los que llegan por postulación no
     hay ese dato. Mostrar esas tres lecturas junto al universo de 245 invitaba
     a leerlas como si fueran de los 245. Así que el universo se quedó acá y el
     detalle se fue a contexto-detalle.html, que dice explícitamente sobre qué
     subconjunto está contando.

     Consecuencia: acá ya no hay filtro cruzado ni pasos internos. La lámina
     entra completa y la flecha siguiente cambia de diapositiva (esta lámina no
     define window.deckStep, así que _nav.js le responde 'nav' al shell). -->
<!-- data-theme-init: el tema llega por ?theme= desde el shell. Se aplica ANTES
     de pintar para que no haya un flash del tema contrario. -->
<script>document.documentElement.dataset.theme=new URLSearchParams(location.search).get("theme")||"dark";</script>
<!-- Datos del proceso. Va acá, síncrono y antes de todo, para que el script del
     final ya tenga window.PROCESO y funcione abriendo el archivo con file://. -->
<script src="../data/proceso.js"></script>
<!-- Puente de navegación con el shell (postMessage). Ver _nav.js. -->
<script src="_nav.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@400;600;700;800;900&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* ===== TEMA =====
     Además de las superficies, acá cambia la PALETA CATEGÓRICA del gráfico
     (--c1..--c3). El JS la lee con getComputedStyle: en oscuro el navy no
     puede ser una serie, porque es el fondo — desaparecería. */
  :root{
    --navy:#1E2D3B; --orange:#FD650D; --peach:#FFAE7F; --white:#FFFFFF;

    --bg:#FFFFFF; --card:#FFFFFF; --surface:#F3F5F9; --border:#E8EAED;
    --heading:#1E2D3B; --body:#333333; --secondary:#717E8E; --gray:#A8B0BA;
    --c1:#FD650D; --c2:#1E2D3B; --c3:#FFAE7F;

    --ease:cubic-bezier(.22,1,.36,1);
  }
  :root[data-theme="dark"]{
    --bg:#1E2D3B; --card:#293745; --surface:#313E4B; --border:rgba(255,255,255,.12);
    --heading:#FFFFFF; --body:rgba(255,255,255,.80);
    --secondary:rgba(255,255,255,.70); --gray:rgba(255,255,255,.45);
    --c1:#FD650D; --c2:#FFAE7F; --c3:#8FA3B8;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; background:var(--bg); }
  body{ font-family:"Inter",sans-serif; color:var(--body); -webkit-font-smoothing:antialiased; overflow:hidden; }

  /* El padding-bottom reserva la banda del logo del pie (lo monta el shell,
     ver #deckLogo en deck.html): sin él, la card queda por debajo del lockup. */
  .slide{ position:relative; width:100vw; height:100vh; background:var(--bg);
    display:flex; flex-direction:column; justify-content:flex-start;
    padding:clamp(40px,5vw,72px); padding-bottom:clamp(70px,10vh,92px); overflow:hidden; }

  .content{ width:100%; max-width:1140px; height:100%; margin:0 auto;
    display:flex; flex-direction:column; min-height:0; }

  /* ===== Encabezado =====
     El total va UNA sola vez acá, no dentro del gráfico: la card es del
     reparto, el número grande es del universo. */
  .head{ display:flex; align-items:flex-start; justify-content:space-between;
    gap:30px; margin-bottom:20px; }

  /* 13 px y no los 11-12 px de un section tag de documento: esto se proyecta a
     un cliente en una sala, no se lee a 40 cm de pantalla. Misma política de
     piso tipográfico en todo el deck. */
  .kicker{ font-family:"Red Hat Display",sans-serif; font-weight:700;
    font-size:13px; text-transform:uppercase; letter-spacing:1.5px; color:var(--secondary);
    margin-bottom:8px;
    opacity:0; transform:translateY(12px); transition:opacity .7s var(--ease), transform .7s var(--ease); transition-delay:.12s; }

  .title{ font-family:"Red Hat Display",sans-serif; font-weight:800;
    font-size:clamp(26px,2.3vw,36px); line-height:1.05; letter-spacing:-.02em; color:var(--heading);
    opacity:0; transform:translateY(18px); transition:opacity .7s var(--ease), transform .7s var(--ease); transition-delay:.20s; }
  .title .accent{ color:var(--orange); }

  .head-stat{ text-align:right; flex:none;
    opacity:0; transform:translateY(18px); transition:opacity .7s var(--ease), transform .7s var(--ease); transition-delay:.26s; }
  .stat-number{ font-family:"Red Hat Display",sans-serif; font-weight:900;
    letter-spacing:-.03em; font-size:clamp(38px,3.6vw,52px); line-height:1; color:var(--heading);
    font-variant-numeric:tabular-nums; }
  .stat-caption{ font-family:"Inter",sans-serif; font-weight:500; font-size:14px;
    color:var(--secondary); margin-top:4px; }

  /* ===== La card del gráfico =====
     Una sola, centrada y protagonista: toma todo el alto que sobra del
     encabezado y se topa a 860 px de ancho. Más ancha que eso, las dos columnas
     quedan tan separadas que dejan de leerse como una comparación. */
  .chart-card{ flex:1; min-height:0; width:100%; max-width:860px; margin:0 auto;
    background:var(--card); border:1px solid var(--border); border-radius:20px;
    padding:20px; display:flex; flex-direction:column;
    opacity:0; transform:translateY(16px);
    transition:opacity .55s var(--ease), transform .55s var(--ease); transition-delay:.34s; }
  .chart-card.on{ opacity:1; transform:none; }

  .card-title{ font-family:"Red Hat Display",sans-serif; font-weight:700; font-size:17px;
    color:var(--heading); margin-bottom:6px; flex:none; }

  .chart-body{ flex:1; min-height:0; display:flex; align-items:center; justify-content:center;
    overflow:hidden; }
  /* El lienzo NO tiene medidas fijas: el JS mide este hueco y arma el viewBox
     con su tamaño real en px (ver medirLienzo). Así 1 unidad = 1 px exacto —
     los rótulos se ven del tamaño que declara su font-size, ni estirados ni
     encogidos — y el dibujo llena la card, sin las bandas que deja
     preserveAspectRatio cuando el lienzo y el hueco no tienen la misma forma. */
  .chart-svg{ width:100%; height:100%; max-height:100%; }

  /* Las columnas crecen desde la línea del cero al entrar la lámina. Es CSS
     puro (transform-box:fill-box hace que el origen sea la caja de la barra y
     no el del SVG entero) y el estado final lo fija .play, así que si las
     transiciones están apagadas la barra aparece entera igual — no depende de
     que la animación alcance a correr. */
  .bar{ transform:scaleY(0); transform-origin:center bottom; transform-box:fill-box;
    transition:transform .7s var(--ease); transition-delay:.55s; }
  .play .bar{ transform:none; }

  /* Cada columna es un grupo con su propia zona sensible: un rectángulo
     transparente que cubre la ranura completa, de punta a punta del lienzo. Sin
     él habría que apuntarle a la barra misma, y la de 31 sobre 245 es una tira
     de 50 px de alto — imposible de acertar en vivo. NO es clickeable: acá no
     hay filtro, así que el cursor se queda en flecha para no prometer un clic
     que no existe. */
  .col .hit{ fill:transparent; pointer-events:all; }
  .col{ cursor:default; }
  .col:focus{ outline:none; }
  .col:focus-visible .bar{ stroke:var(--heading); stroke-width:2; }

  /* Rótulo sobre la columna. Son DOS textos superpuestos en la misma x/y (con
     text-anchor:middle, así que los dos quedan centrados sobre la columna por
     mucho que "87%" y "214" midan distinto) y lo único que pasa al pasar el
     mouse es que uno se apaga y el otro se enciende: nada se mueve ni salta.
     - En reposo se ve el PORCENTAJE, que es el mensaje de la lámina (§7.3.2).
     - Al hover/foco aparece el CONTEO, que es el dato que preguntan.
     La entrada de la lámina la maneja el grupo .vals y el intercambio lo
     manejan los textos: dos opacidades anidadas que se multiplican. Separarlas
     así evita que el retardo de 1,1 s de la entrada se le pegue al hover
     (con una sola transición, sacar el mouse tardaba un segundo en volver). */
  .vals{ opacity:0; transition:opacity .45s var(--ease); transition-delay:1.1s; }
  .play .vals{ opacity:1; }
  .val{ font-family:"Inter",sans-serif; font-weight:500; font-size:24px; fill:var(--heading);
    font-variant-numeric:tabular-nums; transition:opacity .18s var(--ease); }
  .val.num{ opacity:0; }
  .col:hover .val.pct, .col:focus-visible .val.pct{ opacity:0; }
  .col:hover .val.num, .col:focus-visible .val.num{ opacity:1; }

  /* Rótulos del gráfico: 15 y 13 px. Suenan grandes para un chart de documento
     (§7.2 del brandbook habla de 12 px), pero acá el SVG se dibuja 1 unidad =
     1 px sobre la lámina completa, sin escalado: lo que dice el font-size es
     literalmente lo que se proyecta. Si cambias estos números, revisa
     M.izquierda y el interlineado de los rótulos en dibujar(). */
  .lbl{ font-family:"Inter",sans-serif; font-weight:400; font-size:15px; fill:var(--secondary); }
  .tick{ font-family:"Inter",sans-serif; font-weight:400; font-size:13px; fill:var(--secondary);
    font-variant-numeric:tabular-nums; }

  .footer-logo{ position:absolute; left:clamp(40px,5vw,72px); bottom:clamp(24px,3.2vh,40px);
    opacity:0; transition:opacity .7s var(--ease); transition-delay:.65s; }
  .footer-logo img{ height:30px; width:auto; display:block; }

  .play .kicker, .play .title, .play .head-stat, .play .footer-logo{
    opacity:1; transform:none; }

  @media (prefers-reduced-motion: reduce){
    *{ animation:none !important; transition:none !important; }
    .kicker,.title,.head-stat,.footer-logo{ opacity:1 !important; transform:none !important; }
    /* La card y el porcentaje los enciende el JS con .on / .play; sin
       transición simplemente aparecen. La barra sí necesita que se le anule el
       scaleY inicial, que es puro estado de animación. El intercambio de rótulo
       del hover sigue funcionando: es un cambio de opacidad, no una animación,
       y sin transición pasa a ser instantáneo. */
    .bar{ transform:none !important; }
  }

  /* Mensaje de datos ausentes — se usa sólo si data/proceso.js no cargó. */
  .data-error{ font-family:"Inter",sans-serif; font-size:16px; line-height:1.5;
    color:var(--heading); padding:clamp(40px,5vw,72px); }
</style>
</head>
<body>
  <main class="slide" id="slide">
    <div class="content">
      <header class="head">
        <div>
          <!-- El kicker es constante: no depende del proceso. -->
          <p class="kicker">Contexto del proceso de selección</p>
          <!-- Título de la lámina: lo pinta el JS desde PROCESO.contexto. -->
          <h1 class="title"></h1>
        </div>
        <div class="head-stat">
          <!-- Total de candidatos y su glosa. Los pinta el JS. -->
          <div class="stat-number"></div>
          <p class="stat-caption"></p>
        </div>
      </header>

      <section class="chart-card" id="card">
        <p class="card-title" id="cardTitle"></p>
        <div class="chart-body" id="chartBody"></div>
      </section>
    </div>
  </main>

  <script>
    (function(){
      // Sin datos no hay lámina. El mensaje apunta al archivo que hay que
      // revisar: quien edita el deck no necesariamente lee la consola.
      if (!window.PROCESO){
        document.body.innerHTML =
          '<p class="data-error">data/proceso.js no cargó o tiene un error de sintaxis</p>';
        return;
      }

      var slide = document.getElementById('slide');
      var META = window.PROCESO.meta || {};
      var CTX = window.PROCESO.contexto || {};
      var DIMS = CTX.dimensiones || [];
      var CAND = CTX.candidatos || [];

      // La dimensión protagonista la declara el proceso en `contexto.principal`.
      // Si no la declara (o apunta a un id que no existe) cae en la primera:
      // vale más mostrar la lectura equivocada que una lámina en blanco en
      // medio de una presentación.
      var DIM = null;
      for (var d = 0; d < DIMS.length; d++){
        if (DIMS[d].id === CTX.principal){ DIM = DIMS[d]; break; }
      }
      if (!DIM) DIM = DIMS[0];

      if (!DIM){
        document.body.innerHTML =
          '<p class="data-error">data/proceso.js no trae contexto.dimensiones</p>';
        return;
      }

      document.title = 'Contexto — Presentación de candidatos · ' + (META.cargo || '');

      function esc(s){
        return String(s == null ? '' : s)
          .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      }

      // El título va como HTML porque un trozo se pinta en naranjo. Se envuelve
      // SÓLO la primera ocurrencia de `tituloAccent`; si no aparece o no viene,
      // el título queda entero en color de heading. El resto se escapa: el
      // titulo lo escribe una persona, no es campo richtext.
      function tituloHTML(titulo, accent){
        var t = String(titulo == null ? '' : titulo);
        var i = accent ? t.indexOf(accent) : -1;
        if (i < 0) return esc(t);
        return esc(t.slice(0, i)) +
          '<span class="accent">' + esc(accent) + '</span>' +
          esc(t.slice(i + String(accent).length));
      }

      // La paleta categórica vive en el CSS (--c1..--c3) y cambia con el tema:
      // sobre navy, el navy no puede ser una serie porque se funde con el fondo.
      // Cada valor declara un SLOT y acá se resuelve al color real.
      var css = getComputedStyle(document.documentElement);
      var PALETTE = {
        c1: css.getPropertyValue('--c1').trim(),
        c2: css.getPropertyValue('--c2').trim(),
        c3: css.getPropertyValue('--c3').trim()
      };

      var titleEl = document.querySelector('.title');
      var numberEl = document.querySelector('.stat-number');
      var captionEl = document.querySelector('.stat-caption');
      var cardEl = document.getElementById('card');
      var cardTitleEl = document.getElementById('cardTitle');
      var bodyEl = document.getElementById('chartBody');

      // ===================== conteo =====================
      // Una fila con el dato en blanco (null) no cuenta en ESTA dimensión pero
      // sí en el total: por eso las columnas pueden sumar menos que el número
      // grande, y está bien.
      function contar(dimId){
        var out = {};
        for (var i = 0; i < CAND.length; i++){
          var v = CAND[i][dimId];
          if (v == null) continue;
          out[v] = (out[v] || 0) + 1;
        }
        return out;
      }

      // Porcentajes por RESTO MAYOR. Redondear cada columna por separado deja
      // sumas de 99% o 101% (tres tercios dan 33+33+33=99) y en pantalla eso se
      // lee como un error de la consultora, no como un redondeo. Acá se
      // reparten primero los enteros y los puntos que faltan van a las columnas
      // con mayor decimal truncado.
      //
      // El denominador es el TOTAL de candidatos, no la suma de las columnas:
      // si el screening no trae el dato de todos, "87% de los que sí tienen
      // dato" sería otra cifra y otra afirmación. Por eso el objetivo a repartir
      // no es 100 fijo, sino lo que representan las columnas sobre el total —
      // con el dato completo da exactamente 100.
      function porcentajes(conteos, total){
        var nombres = DIM.valores.map(function(v){ return v.nombre; });
        var out = {};
        if (!total){
          nombres.forEach(function(n){ out[n] = 0; });
          return out;
        }

        var suma = 0;
        nombres.forEach(function(n){ suma += (conteos[n] || 0); });
        var objetivo = Math.round(suma / total * 100);

        var partes = nombres.map(function(n){
          var exacto = (conteos[n] || 0) / total * 100;
          var piso = Math.floor(exacto);
          out[n] = piso;
          return { nombre: n, resto: exacto - piso };
        });

        var repartido = 0;
        nombres.forEach(function(n){ repartido += out[n]; });
        partes.sort(function(a, b){ return b.resto - a.resto; });
        for (var i = 0; repartido < objetivo && i < partes.length; i++, repartido++){
          out[partes[i].nombre] += 1;
        }
        return out;
      }

      // ===================== dibujo =====================
      function svgNodo(tag, attrs, texto){
        var n = document.createElementNS('http://www.w3.org/2000/svg', tag);
        for (var k in attrs){ if (attrs[k] != null) n.setAttribute(k, attrs[k]); }
        if (texto != null) n.textContent = texto;
        return n;
      }

      // Paso de la escala Y: el menor de 1/2/5 × 10ⁿ que deja como máximo 4
      // divisiones. Así los rótulos del eje son siempre cifras redondas
      // (0-100-200-300) en vez de los repartos feos que salen de dividir el
      // máximo real en partes iguales.
      function pasoEscala(vmax){
        var bases = [1, 2, 5];
        for (var e = 0; e < 9; e++){
          for (var i = 0; i < bases.length; i++){
            var paso = bases[i] * Math.pow(10, e);
            if (vmax / paso <= 4) return paso;
          }
        }
        return Math.ceil(vmax / 4) || 1;
      }

      // Parte un rótulo largo en máximo 2 líneas para que quepa bajo su columna.
      // Sin esto había que truncarlo (una versión vieja mostraba sólo la primera
      // palabra: "ONGs/Sector público" quedaba en "ONGs/Sector").
      function partirRotulo(texto, maxChars){
        var palabras = String(texto).split(' ');
        var lineas = [''];
        palabras.forEach(function(p){
          var actual = lineas[lineas.length - 1];
          if (!actual){ lineas[lineas.length - 1] = p; return; }
          if ((actual + ' ' + p).length <= maxChars) lineas[lineas.length - 1] = actual + ' ' + p;
          else lineas.push(p);
        });
        if (lineas.length > 2){
          lineas = [lineas[0], lineas.slice(1).join(' ')];
          if (lineas[1].length > maxChars) lineas[1] = lineas[1].slice(0, maxChars - 1) + '…';
        }
        return lineas;
      }

      // Columnas CON EJE Y ROTULADO EN CONTEOS. El eje arranca SIEMPRE en 0
      // (truncarlo exagera diferencias, §7.3 del brandbook). La barra es el
      // conteo; el porcentaje va arriba como anotación. Las dos lecturas
      // conviven a propósito: el reparto se entiende de una pasada y la cifra
      // exacta queda disponible en el eje si el cliente pregunta.
      //
      // W y H llegan medidos del hueco (ver medirLienzo): el lienzo ES el hueco,
      // así que no hay escalado ni bandas y el margen inferior se puede calcular
      // con las líneas de rótulo que de verdad se van a dibujar.
      function dibujar(W, H){
        // Márgenes:
        // - arriba 40: la cabeza de la columna más alta puede llegar al tope del
        //   plot, y el porcentaje (24 px) va 10 px por encima → necesita ~30.
        // - izquierda 44: cabe el rótulo del eje hasta 4 cifras (13 px, cifras
        //   tabulares ≈ 7,8 px cada una = 31) + su separación de 8. Con los
        //   40 de antes, un proceso de 1.000+ candidatos rozaba el borde.
        // - abajo: NO es fijo. Se calcula abajo, cuando ya se sabe si los
        //   rótulos ocupan una línea o dos. Reservar siempre el espacio de dos
        //   dejaba ~33 px muertos bajo el eje cuando ocupaban una — que es lo
        //   que hacía ver el gráfico "caído hacia arriba" dentro de la card.
        var M = { arriba: 40, derecha: 12, abajo: 0, izquierda: 44 };
        var plotL = M.izquierda, plotR = W - M.derecha;
        var plotW = plotR - plotL;

        var conteos = contar(DIM.id);
        var pcts = porcentajes(conteos, CAND.length);

        var vmax = DIM.valores.reduce(function(m, v){
          return Math.max(m, conteos[v.nombre] || 0);
        }, 0);
        var paso = pasoEscala(vmax || 1);
        var maxY = Math.max(paso, Math.ceil(vmax / paso) * paso);

        // Una ranura por valor: el grupo queda centrado solo, con 2, 3 o 4
        // columnas, sin cálculos de offset a mano. El tope de 150 evita que con
        // sólo dos valores las columnas queden como dos bloques enormes.
        var ranura = plotW / DIM.valores.length;
        var anchoCol = Math.min(150, ranura * 0.42);
        var maxChars = Math.max(8, Math.floor(ranura / 8));

        // Los rótulos se parten ANTES de fijar el alto del plot: recién sabiendo
        // cuántas líneas ocupan se puede reservar bajo el eje justo lo que se va
        // a usar — 24 hasta la primera base, 20 por línea extra (interlineado
        // 1,33 para el rótulo de 15 px) y 12 de cola.
        // Esos 12 son el respiro bajo el último rótulo: con la cola justa al
        // descendente de la letra, el rótulo quedaba pegado al borde de la card
        // mientras arriba había 34 de aire. Es la única perilla para repartir
        // ese aire: lo que no se reserve acá se lo lleva el alto del plot.
        var rotulos = DIM.valores.map(function(val){
          return partirRotulo(val.nombre, maxChars);
        });
        var lineas = rotulos.reduce(function(m, r){ return Math.max(m, r.length); }, 1);
        M.abajo = 24 + (lineas - 1) * 20 + 12;

        var plotT = M.arriba, plotB = H - M.abajo;
        var plotH = plotB - plotT;
        function alto(n){ return maxY ? (n / maxY) * plotH : 0; }

        // El gráfico es un GRUPO, no una imagen: cada columna se puede enfocar
        // con el tabulador y trae su propia etiqueta, así que quien navega con
        // lector de pantalla recibe lo mismo que revela el hover — el conteo.
        // Con role="img" en el SVG, el subárbol quedaba oculto y las columnas
        // enfocables no tenían cómo anunciarse.
        var svg = svgNodo('svg', {
          viewBox: '0 0 ' + W + ' ' + H, class: 'chart-svg',
          role: 'group', 'aria-label': (DIM.titulo || DIM.id) +
            '. Total ' + CAND.length + ' candidatos.'
        });

        // Grilla horizontal + rótulos del eje Y. Sólo líneas en los valores
        // rotulados: cada línea de más es tinta que no aporta lectura.
        for (var v = 0; v <= maxY; v += paso){
          var y = plotB - alto(v);
          svg.appendChild(svgNodo('line', {
            x1: plotL, y1: y, x2: plotR, y2: y,
            stroke: v === 0 ? 'var(--gray)' : 'var(--border)', 'stroke-width': 1
          }));
          svg.appendChild(svgNodo('text', {
            x: plotL - 8, y: y, 'text-anchor': 'end', 'dominant-baseline': 'middle',
            class: 'tick'
          }, v));
        }

        DIM.valores.forEach(function(val, i){
          var centro = plotL + ranura * (i + 0.5);
          var n = conteos[val.nombre] || 0;
          var pct = pcts[val.nombre] || 0;
          var h = alto(n);
          var x = centro - anchoCol / 2;

          // Todo lo de una columna va junto en un grupo: así el hover y el foco
          // se declaran una sola vez, sobre el grupo, y valen para la barra, su
          // rótulo y su zona sensible.
          // OJO con el tabindex: _nav.js considera "control" a cualquier cosa
          // con tabindex, así que mientras una columna esté enfocada el Espacio
          // no avanza la lámina (las flechas sí, siempre). Es el precio de que
          // esto se pueda usar con teclado; era el mismo trato que tenía la
          // versión con filtro.
          var g = svgNodo('g', {
            class: 'col', tabindex: 0, role: 'img',
            'aria-label': val.nombre + ': ' + n + ' candidatos, ' + pct + '% del total'
          });

          // Zona sensible: la ranura completa, de arriba a abajo del lienzo.
          // Va PRIMERA para quedar por debajo de todo lo que se dibuja.
          g.appendChild(svgNodo('rect', {
            class: 'hit', x: centro - ranura / 2, y: 0, width: ranura, height: H
          }));

          g.appendChild(svgNodo('rect', {
            class: 'bar', x: x, y: plotB - h, width: anchoCol, height: h,
            fill: PALETTE[val.slot] || PALETTE.c1, rx: 4
          }));

          // Los dos rótulos comparten x e y: el que se ve lo decide la opacidad,
          // no la posición, así que el cambio no mueve nada aunque "87%" y "214"
          // midan distinto. La y depende SÓLO del alto de la barra.
          // (Inter 500, §7.2 del brandbook.)
          var vals = svgNodo('g', { class: 'vals' });
          var yVal = plotB - h - 10;
          vals.appendChild(svgNodo('text', {
            class: 'val pct', x: centro, y: yVal, 'text-anchor': 'middle'
          }, pct + '%'));
          vals.appendChild(svgNodo('text', {
            class: 'val num', x: centro, y: yVal, 'text-anchor': 'middle'
          }, n));
          g.appendChild(vals);

          // Nombre bajo el eje, hasta en dos líneas.
          rotulos[i].forEach(function(linea, li){
            g.appendChild(svgNodo('text', {
              class: 'lbl', x: centro, y: plotB + 24 + li * 20, 'text-anchor': 'middle'
            }, linea));
          });

          svg.appendChild(g);
        });

        return svg;
      }

      // ===================== render =====================
      // El lienzo se mide, no se declara. Un viewBox fijo obliga a
      // preserveAspectRatio a elegir: si su forma no es la del hueco, escala
      // por el lado que topa primero y deja el resto en bandas vacías — con
      // 820×540 dentro de un hueco de 820×580 (16:9) eran 20 px muertos arriba
      // y 20 abajo que el gráfico no podía usar nunca. Midiendo, el lienzo ES
      // el hueco: escala 1, cero bandas, y el % se dibuja a sus 24 px reales.
      // El piso de 240×170 es sólo para que un hueco de 0 px (lámina oculta,
      // medición antes de tiempo) no produzca un SVG degenerado.
      function medirLienzo(){
        var r = bodyEl.getBoundingClientRect();
        return {
          W: Math.max(240, Math.round(r.width) || 820),
          H: Math.max(170, Math.round(r.height) || 540)
        };
      }

      // Redibuja SÓLO si el hueco cambió de tamaño. Sin este resguardo, un
      // evento que no mueve la caja (las webfonts que ya estaban en caché, un
      // resize de 0 px) rehace el SVG en medio de la animación de entrada y las
      // columnas pegan un salto a su altura final.
      var dibujado = { W: 0, H: 0 };
      function redibujar(){
        var L = medirLienzo();
        if (L.W === dibujado.W && L.H === dibujado.H) return;
        dibujado = L;
        bodyEl.innerHTML = '';
        bodyEl.appendChild(dibujar(L.W, L.H));
      }

      titleEl.innerHTML = tituloHTML(CTX.titulo, CTX.tituloAccent);
      numberEl.textContent = CAND.length;
      captionEl.textContent = CTX.caption || '';
      cardTitleEl.textContent = DIM.titulo || DIM.id;
      redibujar();

      // El hueco cambia de tamaño con la ventana (y un poco cuando terminan de
      // cargar las webfonts, porque el encabezado se asienta). En los dos casos
      // hay que rehacer el lienzo, o vuelven las bandas. El rAF junta la ráfaga
      // de eventos de un arrastre en un solo redibujo. Redibujar NO reinicia la
      // animación: como .play ya está puesto, las barras nacen en su estado
      // final y no hay transición que disparar.
      var redibujoPendiente = 0;
      window.addEventListener('resize', function(){
        if (redibujoPendiente) cancelAnimationFrame(redibujoPendiente);
        redibujoPendiente = requestAnimationFrame(function(){
          redibujoPendiente = 0;
          redibujar();
        });
      });
      if (document.fonts && document.fonts.ready && document.fonts.ready.then){
        document.fonts.ready.then(redibujar).catch(function(){});
      }

      // El DOM se construye ANTES de disparar la coreografía: las transiciones
      // tienen que ver el contenido final, no los contenedores vacíos. Los dos
      // rAF le dan al navegador la vuelta de estilo que necesita para registrar
      // el estado inicial (opacidad 0, barra en scaleY(0)) y recién ahí animar.
      requestAnimationFrame(function(){
        requestAnimationFrame(function(){
          cardEl.classList.add('on');
          slide.classList.add('play');
        });
      });

      // OJO: esta lámina NO define window.deckStep, a propósito. Entra completa
      // y no tiene nada que revelar de a poco, así que _nav.js le responde
      // 'nav' al shell y la flecha cambia de diapositiva. Por lo mismo un
      // ?at=end (el shell entrando de vuelta desde la lámina siguiente) no
      // necesita hacer nada: la lámina ya está en su estado final.
    })();
  </script>
</body>
</html>
